<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(255, 255, 255);
            height: 100vh;
            display: flex;
            justify-content: center;
            gap: 25px;
            align-items: center;
            flex-wrap: wrap;

        }
        .product{
            border: 1px solid black;
            border-radius: 12px;
            width: 250px;
            height: 350px;
            margin-bottom: 15px;
            padding: 12px;
            text-align: center;
            /*box-shadow: Xaxis Yaxis Spread-Radius ColoroName;*/
            box-shadow: 0px 4px 10px black;

        }
        .product:hover{
            background-color: rgb(161, 145, 145);
            transition: 1s;
            transform: scale(1.01);
        }
        .product img{
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
        }
        .product button{
            background-color: rgb(255, 149, 0);
            padding: 10px;
            border-radius: 12px;
            border: none;
            width: 90%;
        }
        </style>
</head>
<body>
    <div class="product">
        <img src="https://images.pexels.com/photos/7772548/pexels-photo-7772548.jpeg" alt="" >
        <h2>HeadPhone</h2>
        <p>Rs 2000</p>
        <Button>Buy Now</Button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/214488/pexels-photo-214488.jpeg" alt="" >
        <h2>Smartphone</h2>
        <p>Rs 15000</p>
        <Button>Buy Now</Button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/6611936/pexels-photo-6611936.jpeg" alt="" >
        <h2>Laptop</h2>
        <p>Rs 50000</p>
        <Button>Buy Now</Button>
    </div>

    <div class="product">
        <img src="https://images.pexels.com/photos/10680035/pexels-photo-10680035.jpeg" alt="" >
        <h2>Controller</h2>
        <p>Rs 3000</p>
        <Button>Buy Now</Button>
    </div>

</body>
</html>
