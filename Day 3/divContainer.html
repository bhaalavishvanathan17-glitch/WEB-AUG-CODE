<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- DIV container is also know as Block Level Element(Tag) It Takes 100% width-->
    <div style="background-color: yellow;" width="250px">
        <h2>Books</h2>
        <p>This is a Box of Books</p>
        <button>Buy Now</button>
    </div>
    <div style="background-color: lightgreen;">
        <h2>Fruits</h2>
        <p>This is a Box of Fruits</p>
    </div>

    <!-- SPAN container is also know as Inline Level Element(Tag) It Takes only the width of the content-->
     <p>Good evening , How are you ?</p>
     <p>Good <span style="background-color: rgb(114, 95, 210);">Morning</span> , Howdy?</p>  
     <button>cart 0</button>
     <Button>cart <span style="background-color: aquamarine;">0</span></Button>
</body>
</html>
