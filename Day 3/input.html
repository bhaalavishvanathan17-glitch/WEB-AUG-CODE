<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="">USERNAME</label>
    <input placeholder="Enter Your Name" type="text"><br><br>
    <label for="">Email</label>
    <input placeholder="Enter your Email" type="email"><br><br>
    <label for="">Password</label>
    <input placeholder="Enter your Password" type="password"><br><br>

    <label for="">Mobile</label>
    <input placeholder="Enter your Mobile Number" type="tel"><br><br>

    <label for="">Date of Birth</label>
    <input placeholder="Enter your Date of Birth" type="date"><br><br>

    <label for="">File Upload</label>
    <input type="file"><br><br>

    <label for="">Age</label>
    <input placeholder="Enter your Age" type="number"><br><br>

    <label for="">Fav color</label>
    <input type="color"><br><br>

    <input type="checkbox"><br>
    <input type="range"><br>
    <input type="radio"><br>
    <button type="submit">Register</button>
</body>
