<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //operator - Action on Data
        //1 Arthmetic operator - +,-,/,*,%(Remainder)
        let x = 10
        let y = 5
        console.log(x+y) // 15
        console.log(x-y) // 5
        console.log(x*y) //2
        console.log(x/y) //50
        console.log(x%y) //0

        // % Remainder -

        console.log(13 % 2) //1
        console.log(12 % 5) //2

        // left < right = Left No
        
        console.log(2 % 9) //2
        console.log(1 % 6) //1

        //2. Assignment - =

        let score = 5
        // score = sore + 3
        score += 3
        // score -= 1
        console.log(score) //

        //3. Comparsion Operator
        let a = 10
        let b = 8
        console.log(a>b) //true
        console.log(a<b) //false

        let xyz = 15
        let pqr = 15
        console.log(xyz >= pqr) // true

        console.log(xyz <= pqr) //true

        let height1 = 100
        let height2 = "100"
        //== : It will Only Checks The Value
        console.log(height1 == height2) // true

        // === : It will checks both value and DATA TYPE
        console.log(height1 === height2) // false

        //logical Operators- AND, OR, !
        //AND - Both Condition True Then Only OUTPUT is TRUE
        let isMember = true // or we can give false
        let TotalBill = 1000
        console.log( "Result of And", isMember && TotalBill >= 800)
        //OR - Atleast 1 condition is True output is True
        console.log("Result of OR", isMember || TotalBill >= 800)

        //! - Filp /Opp value
        let NetflixSubb = false
        console.log(!NetflixSubb)

        let isFollow = false
        console.log(!isFollow)




    </script>
</body>
</html>
