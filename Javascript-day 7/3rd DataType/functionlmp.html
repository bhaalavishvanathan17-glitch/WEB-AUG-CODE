<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Functions - Are used to do a specific Task
        //1. function keyword symbol functioname()
        function Greet(){
            //Body - Instruction of task
            console.log("Good evening user")

        }
        Greet() //Calling The function - To do the task

        //2. function with parameter (parameter - wwhich acts like variable)
        function Greeting(name){
            console.log("Good Evening "+ name )
        }
        Greeting("Aman")
        Greeting("Bhavana")

        //3. function with return keyword
        function Add(a,b){
            return a+b
        }       
        let result= Add(10,5)
        console.log(result)

        

    </script>
</body>
</html>
